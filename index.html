<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA身份验证器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .code-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .code-display {
            margin-bottom: 15px;
        }

        .code-digits {
            font-size: 48px;
            font-weight: 700;
            color: white;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .code-digits.active {
            transform: scale(1.05);
        }

        .waiting-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .waiting-text.hidden {
            display: none;
        }

        .timer-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 24px;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 3px;
            transition: width 1s linear;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .input-group input.password {
            -webkit-text-security: disc;
            text-security: disc;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            transform: translateY(-50%) scale(1.2);
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .admin-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(102, 126, 234, 0.1);
            text-align: center;
        }

        .author {
            color: #999;
            font-size: 13px;
            font-weight: 400;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .code-digits {
                font-size: 36px;
                letter-spacing: 6px;
            }

            .timer {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 2FA身份验证器</h1>
        </div>

        <div class="code-section">
            <div class="code-display">
                <div id="codeDigits" class="code-digits">------</div>
                <div class="waiting-text">等待输入密钥中...</div>
            </div>

            <div class="timer-section">
                <span>剩余时间：</span>
                <span id="timer" class="timer">30</span>
                <span>秒</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 100%"></div>
            </div>

            <button id="copyBtn" class="copy-btn">📋 复制验证码</button>
        </div>

        <div class="input-section">
            <label for="secretInput" style="display: block; color: #666; font-size: 14px; font-weight: 500; margin-bottom: 8px;">输入密钥</label>
            <div class="input-group">
                <input
                    type="text"
                    id="secretInput"
                    placeholder="请输入密钥"
                    autocomplete="off"
                >
                <button id="toggleBtn" class="toggle-btn">🙈</button>
            </div>

            <button id="generateBtn" class="generate-btn">生成验证码</button>
        </div>

        <div class="footer">
            <span class="author">⚡ 闲鱼店铺：效率工具补给点/0零点o</span>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/otpauth@9.2.2/dist/otpauth.umd.min.js"></script>
    <script>
        class OTPGenerator {
            constructor() {
                this.secretKey = '';
                this.totp = null;
                this.updateInterval = null;
                this.isPasswordMode = false;

                this.initElements();
                this.bindEvents();
                this.loadSavedSecret();
            }

            initElements() {
                this.codeDigits = document.getElementById('codeDigits');
                this.waitingText = document.querySelector('.waiting-text');
                this.secretInput = document.getElementById('secretInput');
                this.generateBtn = document.getElementById('generateBtn');
                this.copyBtn = document.getElementById('copyBtn');
                this.toggleBtn = document.getElementById('toggleBtn');
                this.timer = document.getElementById('timer');
                this.progressFill = document.getElementById('progressFill');
                this.toast = document.getElementById('toast');
            }

            bindEvents() {
                this.generateBtn.addEventListener('click', () => this.generateCode());
                this.copyBtn.addEventListener('click', () => this.copyCode());
                this.toggleBtn.addEventListener('click', () => this.togglePasswordMode());
                this.secretInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.generateCode();
                });
            }

            generateCode() {
                const secret = this.secretInput.value.trim().replace(/\s/g, '');

                if (!secret) {
                    this.showToast('请输入密钥');
                    return;
                }

                try {
                    this.totp = new OTPAuth.TOTP({
                        issuer: '2FA',
                        label: 'User',
                        algorithm: 'SHA1',
                        digits: 6,
                        period: 30,
                        secret: secret
                    });

                    this.secretKey = secret;
                    this.saveSecret(secret);
                    this.startGenerating();
                    this.showToast('验证码生成成功');
                } catch (error) {
                    console.error('Error generating TOTP:', error);
                    this.showToast('密钥格式错误，请检查后重试');
                }
            }

            startGenerating() {
                this.updateCode();

                if (this.updateInterval) {
                    clearInterval(this.updateInterval);
                }

                this.updateInterval = setInterval(() => {
                    this.updateCode();
                }, 1000);
            }

            updateCode() {
                if (!this.totp) return;

                try {
                    const code = this.totp.generate();
                    const timeRemaining = this.totp.period - (Math.floor(Date.now() / 1000) % this.totp.period);

                    if (this.codeDigits.textContent !== code) {
                        this.codeDigits.textContent = code;
                        this.codeDigits.classList.add('active');
                        setTimeout(() => this.codeDigits.classList.remove('active'), 300);
                    }

                    this.waitingText.classList.add('hidden');
                    this.timer.textContent = timeRemaining;

                    const progress = (timeRemaining / this.totp.period) * 100;
                    this.progressFill.style.width = `${progress}%`;

                    if (timeRemaining <= 5) {
                        this.timer.style.color = '#ffeb3b';
                    } else {
                        this.timer.style.color = 'white';
                    }
                } catch (error) {
                    console.error('Error updating code:', error);
                }
            }

            copyCode() {
                console.log('复制按钮被点击');
                const code = this.codeDigits.textContent;
                console.log('当前验证码:', code);

                if (code === '------') {
                    this.showToast('⚠️ 请先生成验证码');
                    return;
                }

                // 直接使用传统方法（更兼容 HTTP）
                this.fallbackCopy(code);
            }

            fallbackCopy(text) {
                // 创建临时输入框
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);

                // 选中并复制
                textarea.select();
                textarea.setSelectionRange(0, 99999); // 移动端兼容

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        this.showToast('✅ 验证码已复制');
                    } else {
                        this.showToast('❌ 复制失败，请手动复制');
                    }
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                    this.showToast('❌ 复制失败，请手动复制: ' + text);
                } finally {
                    document.body.removeChild(textarea);
                }
            }

            togglePasswordMode() {
                this.isPasswordMode = !this.isPasswordMode;

                if (this.isPasswordMode) {
                    this.secretInput.classList.add('password');
                    this.toggleBtn.textContent = '👁️';
                } else {
                    this.secretInput.classList.remove('password');
                    this.toggleBtn.textContent = '🙈';
                }
            }

            saveSecret(secret) {
                try {
                    localStorage.setItem('totp_secret', secret);
                } catch (error) {
                    console.error('Failed to save secret:', error);
                }
            }

            loadSavedSecret() {
                try {
                    const saved = localStorage.getItem('totp_secret');
                    if (saved) {
                        this.secretInput.value = saved;
                    }
                } catch (error) {
                    console.error('Failed to load secret:', error);
                }
            }

            showToast(message) {
                this.toast.textContent = message;
                this.toast.classList.add('show');

                setTimeout(() => {
                    this.toast.classList.remove('show');
                }, 2000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new OTPGenerator();
        });
    </script>
</body>
</html>
