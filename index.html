<!DOCTYPE html>

    <meta name="force-rendering" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA身份验证器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f8f5;
            background-image: 
                radial-gradient(circle at 0% 0%, #b5f0cc 0%, transparent 35%),             /* 左上：一小片亮薄荷绿 */
                radial-gradient(circle at 100% 0%, #f0edc0 0%, transparent 25%),            /* 右上：淡暖黄 */
                radial-gradient(circle at 0% 100%, #d0e6d8 0%, transparent 30%),            /* 左下：灰绿/鼠尾草绿 */
                radial-gradient(circle at 50% 88%, #b5f0cc 0%, transparent 25%);          /* 卡片正下方：薄荷绿（与左上呼应） */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 80, 40, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #003322;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .code-section {
            background: linear-gradient(135deg, #00c65c 0%, #8ae000 100%);
            padding: 35px 30px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 198, 92, 0.3);

        .code-display {
            margin-bottom: 15px;

        .code-digits {
            font-size: 42px;
            font-weight: 700;

            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            transition: all 0.3s;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

        .code-digits.active {
            transform: scale(1.05);
        }

        .waiting-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .waiting-text.hidden {
            display: none;
        }

        .timer-section {
            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 22px;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;

            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;

            margin-bottom: 20px;

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;

            width: 100%;
            padding: 12px;

            color: #007a3d;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            color: #005c2e;
            transform: translateY(-2px);
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 1px solid #bcead1;
            background: #f5fcf8;
            border-radius: 12px;
            font-size: 15px;
            color: #004d2e;
            outline: none;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .input-group input::placeholder {
            color: #9ac9b1;
        }

        /* 密码隐藏通过 type="password" 切换实现，跨浏览器兼容 */

        .input-group input:focus {
            border-color: #00c65c;
            box-shadow: 0 0 0 3px rgba(0, 198, 92, 0.15);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            transform: translateY(-50%) scale(1.2);
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: #00c65c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;

            transform: translateY(-2px);

        .admin-link {

        .clock-warning {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;

            color: #8a6d3b;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            font-size: 13px;

        .clock-warning.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(16, 185, 129, 0.1);
            text-align: center;
        }

        .author {
            color: #999;
            font-size: 13px;
            font-weight: 400;
        }

        .lang-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #e9f8f0;
            color: #009955;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: #d4f1e1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .code-digits {
                font-size: 36px;
                letter-spacing: 6px;
            }

            .timer {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <script>
        /*
         * 纯 JS 内置 TOTP 实现（HMAC-SHA1）。
         * 不依赖任何外部 CDN，也不依赖 crypto.subtle，因此：
         *   - 在 http:// 等"非安全上下文"下也能算出验证码；
         *   - 在国内 jsdelivr 被墙/加载失败时仍可用；
         *   - 在较老的浏览器内核下也能运行。
         * 已通过 RFC 6238 官方测试向量校验。
         */
        // ===== 多语言 i18n：按浏览器语言自动切换，并提供手动切换按钮 =====
        var I18N = {
            zh: {
                title: '2FA身份验证器',
                heading: '🔐 2FA身份验证器',
                waiting: '等待输入密钥中...',
                remaining: '剩余时间：',
                seconds: '秒',
                copyBtn: '📋 复制验证码',
                secretLabel: '输入密钥',
                secretPlaceholder: '请输入密钥',
                generateBtn: '生成验证码',
                langToggle: 'EN',
                needSecret: '请输入密钥',
                invalidChars: '密钥含非法字符，仅支持 A-Z 和 2-7',
                generated: '验证码生成成功',
                calcError: '密钥格式错误，请检查后重试',
                genFirst: '⚠️ 请先生成验证码',
                copied: '✅ 验证码已复制',
                copyFail: '❌ 复制失败，请手动复制',
                copyFailManual: '❌ 复制失败，请手动复制: ',
                clockWarn: function (s) { return '⚠️ 检测到本机时间与标准时间相差约 ' + s + ' 秒。TOTP 依赖本机时钟，请在系统设置里开启“自动同步网络时间”，否则生成的验证码会失效。'; }
            },
            en: {
                title: '2FA Authenticator',
                heading: '🔐 2FA Authenticator',
                waiting: 'Waiting for a secret key...',
                remaining: 'Time left:',
                seconds: 's',
                copyBtn: '📋 Copy code',
                secretLabel: 'Secret key',
                secretPlaceholder: 'Enter your secret key',
                generateBtn: 'Generate code',
                langToggle: '中',
                needSecret: 'Please enter a secret key',
                invalidChars: 'Invalid characters. Only A-Z and 2-7 are allowed',
                generated: 'Code generated',
                calcError: 'Invalid secret format, please check and retry',
                genFirst: '⚠️ Please generate a code first',
                copied: '✅ Code copied',
                copyFail: '❌ Copy failed, please copy manually',
                copyFailManual: '❌ Copy failed, please copy manually: ',
                clockWarn: function (s) { return '⚠️ Your device clock is off by ~' + s + 's from standard time. TOTP relies on your device clock — please enable “Set time automatically” in system settings, otherwise generated codes will be rejected.'; }
            }
        };
        var LANG = 'zh';
        function t(key) { return I18N[LANG][key]; }
        function detectLang() {
            try { var s = localStorage.getItem('ui_lang'); if (s === 'zh' || s === 'en') return s; } catch (e) { }
            var l = (navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || '';
            return l.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }
        function applyLang(lang) {
            LANG = (lang === 'en') ? 'en' : 'zh';
            var d = I18N[LANG];
            document.documentElement.lang = (LANG === 'zh') ? 'zh-CN' : 'en';
            document.title = d.title;
            var set = function (id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; };
            set('heading', d.heading);
            set('waitingText', d.waiting);
            set('remainingLabel', d.remaining);
            set('secondsLabel', d.seconds);
            set('copyBtn', d.copyBtn);
            set('secretLabel', d.secretLabel);
            set('generateBtn', d.generateBtn);
            set('langBtn', d.langToggle);
            var input = document.getElementById('secretInput'); if (input) input.placeholder = d.secretPlaceholder;
            var footer = document.getElementById('footer'); if (footer) footer.style.display = (LANG === 'zh') ? '' : 'none';
        }

        var TOTP = (function () {
            function sha1Bytes(bytes) {
                var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
                var ml = bytes.length * 8;
                var msg = bytes.slice();
                msg.push(0x80);
                while (msg.length % 64 !== 56) msg.push(0);
                var hi = Math.floor(ml / 0x100000000);
                var lo = ml >>> 0;
                msg.push((hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff);
                msg.push((lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff);
                var w = new Array(80);
                for (var i = 0; i < msg.length; i += 64) {
                    for (var j = 0; j < 16; j++) {
                        w[j] = ((msg[i + j * 4] << 24) | (msg[i + j * 4 + 1] << 16) | (msg[i + j * 4 + 2] << 8) | (msg[i + j * 4 + 3]));
                    }
                    for (var j = 16; j < 80; j++) {
                        var n = w[j - 3] ^ w[j - 8] ^ w[j - 14] ^ w[j - 16];
                        w[j] = (n << 1) | (n >>> 31);
                    }
                    var a = h0, b = h1, c = h2, d = h3, e = h4;
                    for (var j = 0; j < 80; j++) {
                        var f, k;
                        if (j < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
                        else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
                        else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
                        else { f = b ^ c ^ d; k = 0xCA62C1D6; }
                        var temp = (((a << 5) | (a >>> 27)) + f + e + k + w[j]) | 0;
                        e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
                    }
                    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
                }
                function tb(h) { return [(h >>> 24) & 0xff, (h >>> 16) & 0xff, (h >>> 8) & 0xff, h & 0xff]; }
                return [].concat(tb(h0), tb(h1), tb(h2), tb(h3), tb(h4));
            }

            function hmacSha1Bytes(key, msg) {
                if (key.length > 64) key = sha1Bytes(key);
                var k = key.slice();
                while (k.length < 64) k.push(0);
                var ipad = [], opad = [];
                for (var i = 0; i < 64; i++) { ipad.push(k[i] ^ 0x36); opad.push(k[i] ^ 0x5c); }
                var inner = sha1Bytes(ipad.concat(msg));
                return sha1Bytes(opad.concat(inner));
            }

            function base32Decode(s) {
                var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
                s = s.replace(/=+$/, '').toUpperCase();
                var bits = 0, val = 0, out = [];
                for (var i = 0; i < s.length; i++) {
                    var idx = alphabet.indexOf(s.charAt(i));
                    if (idx < 0) continue;
                    val = (val << 5) | idx; bits += 5;
                    if (bits >= 8) { bits -= 8; out.push((val >>> bits) & 0xff); }
                }
                return out;
            }

            function generate(secret, period, digits, nowMs) {
                period = period || 30; digits = digits || 6;
                var key = base32Decode(secret);
                var counter = Math.floor((nowMs || Date.now()) / 1000 / period);
                var hi = Math.floor(counter / 0x100000000);
                var lo = counter >>> 0;
                var msg = [(hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff,
                (lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff];
                var hmac = hmacSha1Bytes(key, msg);
                var offset = hmac[19] & 0xf;
                var code = ((hmac[offset] & 0x7f) << 24) | (hmac[offset + 1] << 16) | (hmac[offset + 2] << 8) | (hmac[offset + 3]);
                code = code % Math.pow(10, digits);
                var str = '' + code;
                while (str.length < digits) str = '0' + str;
                return str;
            }

            return { generate: generate };
        })();
    </script>
    <script>
        class OTPGenerator {
            constructor() {
                this.secretKey = '';
                this.period = 30;
                this.digits = 6;
                this.updateInterval = null;
                this.isPasswordMode = false;

                this.initElements();
                this.bindEvents();
                this.loadSavedSecret();
                this.checkClock();
            }

            initElements() {
                this.codeDigits = document.getElementById('codeDigits');
                this.waitingText = document.querySelector('.waiting-text');
                this.secretInput = document.getElementById('secretInput');
                this.generateBtn = document.getElementById('generateBtn');
                this.copyBtn = document.getElementById('copyBtn');
                this.toggleBtn = document.getElementById('toggleBtn');
                this.timer = document.getElementById('timer');
                this.progressFill = document.getElementById('progressFill');
                this.toast = document.getElementById('toast');
                this.clockWarning = document.getElementById('clockWarning');
            }

            bindEvents() {
                this.generateBtn.addEventListener('click', () => this.generateCode());
                this.copyBtn.addEventListener('click', () => this.copyCode());
                this.toggleBtn.addEventListener('click', () => this.togglePasswordMode());
                this.secretInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.generateCode();
                });
            }

            generateCode() {
                // 清洗密钥：去除空白、等号填充、转大写，兼容各种粘贴格式
                const raw = this.secretInput.value;
                const secret = raw.trim().replace(/[\s\-_=]/g, '').toUpperCase();

                if (!secret) {
                    this.showToast(t('needSecret'));
                    return;
                }

                // 验证Base32字符集
                if (!/^[A-Z2-7]+$/.test(secret)) {
                    this.showToast(t('invalidChars'));
                    return;
                }

                this.secretKey = secret;
                this.saveSecret(secret);
                this.startGenerating();
                this.showToast(t('generated'));
            }

            startGenerating() {
                this.updateCode();

                if (this.updateInterval) {
                    clearInterval(this.updateInterval);
                }

                this.updateInterval = setInterval(() => {
                    this.updateCode();
                }, 1000);
            }

            updateCode() {
                if (!this.secretKey) return;

                const timeRemaining = this.period - (Math.floor(Date.now() / 1000) % this.period);

                try {
                    const code = TOTP.generate(this.secretKey, this.period, this.digits);
                    this._applyCode(code, timeRemaining);
                } catch (error) {
                    console.error('验证码计算失败:', error);
                    this.showToast(t('calcError'));
                    if (this.updateInterval) clearInterval(this.updateInterval);
                }
            }

            _applyCode(code, timeRemaining) {
                if (this.codeDigits.textContent !== code) {
                    this.codeDigits.textContent = code;
                    this.codeDigits.classList.add('active');
                    setTimeout(() => this.codeDigits.classList.remove('active'), 300);
                }

                this.waitingText.classList.add('hidden');
                this.timer.textContent = timeRemaining;

                const progress = (timeRemaining / this.period) * 100;
                this.progressFill.style.width = `${progress}%`;

                if (timeRemaining <= 5) {
                    this.timer.style.color = '#ffeb3b';
                } else {
                    this.timer.style.color = 'white';
                }
            }

            copyCode() {
                const code = this.codeDigits.textContent;

                if (code === '------') {
                    this.showToast(t('genFirst'));
                    return;
                }

                this.fallbackCopy(code);
            }

            fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);

                textarea.select();
                textarea.setSelectionRange(0, 99999);

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        this.showToast(t('copied'));
                    } else {
                        this.showToast(t('copyFail'));
                    }
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                    this.showToast(t('copyFailManual') + text);
                } finally {
                    document.body.removeChild(textarea);
                }
            }

            togglePasswordMode() {
                this.isPasswordMode = !this.isPasswordMode;

                const eyeIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                const eyeOffIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

                if (this.isPasswordMode) {
                    this.secretInput.type = 'password';
                    this.toggleBtn.innerHTML = eyeIcon;
                } else {
                    this.secretInput.type = 'text';
                    this.toggleBtn.innerHTML = eyeOffIcon;
                }
            }

            // 与公共时间接口比对，提示用户本机时钟是否准确。
            // TOTP 完全基于本机时间，时钟偏差超过约 30 秒就会导致生成的验证码被拒绝。
            checkClock() {
                try {
                    const t0 = Date.now();
                    const xhr = new XMLHttpRequest();
                    // 该接口返回服务器 Date 响应头，用于估算本机与标准时间的偏差
                    xhr.open('HEAD', 'https://www.cloudflare.com/cdn-cgi/trace?_=' + t0, true);
                    xhr.timeout = 5000;
                    xhr.onreadystatechange = () => {
                        if (xhr.readyState === xhr.HEADERS_RECEIVED) {
                            const serverDate = xhr.getResponseHeader('Date');
                            if (!serverDate) return;
                            const t1 = Date.now();
                            const rtt = t1 - t0;
                            const serverMs = new Date(serverDate).getTime() + rtt / 2;
                            const skew = Math.abs(serverMs - t1) / 1000;
                            if (skew > 10) {
                                this.clockWarning.textContent = t('clockWarn')(Math.round(skew));
                                this.clockWarning.classList.add('show');
                            }
                        }
                    };
                    xhr.send();
                } catch (e) {
                    // 时钟检测失败不影响主功能，静默忽略
                }
            }

            saveSecret(secret) {
                try {
                    localStorage.setItem('totp_secret', secret);
                } catch (error) {
                    console.error('Failed to save secret:', error);
                }
            }

            loadSavedSecret() {
                try {
                    const saved = localStorage.getItem('totp_secret');
                    if (saved) {
                        this.secretInput.value = saved;
                    }
                } catch (error) {
                    console.error('Failed to load secret:', error);
                }
            }

            showToast(message) {
                this.toast.textContent = message;
                this.toast.classList.add('show');

                setTimeout(() => {
                    this.toast.classList.remove('show');
                }, 2000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLang(detectLang());
            var langBtn = document.getElementById('langBtn');
            if (langBtn) {
                langBtn.addEventListener('click', function () {
                    var next = (LANG === 'zh') ? 'en' : 'zh';
                    try { localStorage.setItem('ui_lang', next); } catch (e) { }
                    applyLang(next);
                });
            }
            new OTPGenerator();
        });
    </script>
</body>

</html>
